name: Bug report
description: Report reproducible WeRelay behavior without publishing private data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, setup links, public IPs, local usernames, task IDs, project names and message contents before submitting. For security issues, use a private Security Advisory instead.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Provide minimal steps using placeholder names and addresses.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WeRelay version
      placeholder: "WeRelay version or GitHub commit"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: I removed credentials, tokens, setup links, private paths, task IDs and identifying screenshots.
          required: true
